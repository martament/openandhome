# openandhome: Telegraf fuer die Sensorboxen. Werte aus Umgebungsvariablen (stack/README.md).

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  hostname = "${OH_HOSTNAME}"
  omit_hostname = false

# --- Eingaenge: Sensorboxen ----------------------------------------------------

# ESPEasy-Controller: Publish openandhome/%sysname%/%tskname%/%valname%
[[inputs.mqtt_consumer]]
  servers = ["${OH_MQTT_URL}"]
  topics = ["openandhome/+/+/+"]
  username = "telegraf"
  password = "${OH_MQTT_TELEGRAF_PASSWORD}"
  client_id = "openandhome-telegraf"
  qos = 0
  name_override = "openandhome"
  topic_tag = ""
  data_format = "value"
  # Zahl, sonst Text (z. B. LWT "Connected"/"Connection Lost") - sortiert unten Starlark
  data_type = "auto_float"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "openandhome/+/+/+"
    tags = "_/sensorbox/device/valuename"

# Online-Status (openandhome/<Box>/status/LWT) -> Measurement openandhome_status;
# sonst nur gueltige Zahlen behalten (kein Text, kein NaN).
[[processors.starlark]]
  namepass = ["openandhome"]
  source = '''
def apply(metric):
    if metric.tags.get("device") == "status":
        metric.name = "openandhome_status"
        return metric
    v = metric.fields.get("value")
    if type(v) != "float" or v != v:
        return None
    return metric
'''

# ESPEasy-Syslog: "<PRI>Box EspEasy: Text" (ohne Zeitstempel - inputs.syslog verwirft
# dann den Text). Daher als Rohzeile empfangen und unten per Starlark zerlegen.
[[inputs.socket_listener]]
  service_address = "udp://:${OH_SYSLOG_PORT}"
  name_override = "syslog"
  data_format = "value"
  data_type = "string"

[[processors.starlark]]
  namepass = ["syslog"]
  source = '''
SEVERITY = ["emerg", "alert", "crit", "err", "warning", "notice", "info", "debug"]

def apply(metric):
    line = metric.fields.pop("value", "").strip()
    if line.startswith("<") and ">" in line:
        pri = line[1:line.index(">")]
        if pri.isdigit():
            metric.tags["severity"] = SEVERITY[int(pri) % 8]
            line = line[line.index(">") + 1:]
    for sep in [" EspEasy:", "_EspEasy:"]:
        if sep in line:
            metric.tags["sensorbox"] = line[:line.index(sep)].strip()
            line = line[line.index(sep) + len(sep):]
            break
    metric.fields["message"] = line.strip()
    return metric
'''

# --- Eingaenge: Server ---------------------------------------------------------

[[inputs.cpu]]
  percpu = false
  totalcpu = true
[[inputs.mem]]
[[inputs.swap]]
[[inputs.system]]
[[inputs.disk]]
  mount_points = ["/"]
[[inputs.net]]
  interfaces = ["eth0"]
  ignore_protocol_stats = true
[[inputs.temp]]

# --- Ausgaenge (InfluxDB 2, v1-Schnittstelle, Datenbank = Bucket) --------------

[[outputs.influxdb]]
  urls = ["${OH_INFLUX_URL}"]
  database = "openandhome"
  skip_database_creation = true
  username = "telegraf"
  password = "${OH_INFLUX_TELEGRAF_PASSWORD}"
  namepass = ["openandhome", "openandhome_status"]

[[outputs.influxdb]]
  urls = ["${OH_INFLUX_URL}"]
  database = "sensorbox_logs"
  skip_database_creation = true
  username = "telegraf"
  password = "${OH_INFLUX_TELEGRAF_PASSWORD}"
  namepass = ["syslog"]

[[outputs.influxdb]]
  urls = ["${OH_INFLUX_URL}"]
  database = "system"
  skip_database_creation = true
  username = "telegraf"
  password = "${OH_INFLUX_TELEGRAF_PASSWORD}"
  namedrop = ["openandhome", "openandhome_status", "syslog"]
