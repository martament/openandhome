---
- name: Journal neu starten
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: SSH neu laden
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Firewall neu laden
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted
