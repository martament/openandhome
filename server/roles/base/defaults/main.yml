---
base_packages:
  - python3-debian        # fuer ansible.builtin.deb822_repository
  - nftables
  - unattended-upgrades
  - i2c-tools
  - curl
  - ca-certificates

# Fremdquellen (deb822). Der Schluessel wird auf dem Werkstatt-PC geladen und gegen
# den Fingerabdruck geprueft; nur ein passender Schluessel kommt auf den Server.
base_apt_repos:
  - name: influxdata      # influxdb2, influxdb2-cli, telegraf
    uris: https://repos.influxdata.com/debian
    suites: stable
    components: main
    key_url: https://repos.influxdata.com/influxdata-archive.key
    fingerprint: 24C975CBA61A024EE1B631787C3D57159FC2F927
  - name: grafana         # grafana (OSS); Schluessel laeuft 2027-08-22 ab
    uris: https://apt.grafana.com
    suites: stable
    components: main
    key_url: https://apt.grafana.com/gpg.key
    fingerprint: B53AE77BADB630A683046005963FA27710458545

base_journal_max_use: 100M
