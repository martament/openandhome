---
# Grundsystem + Dienste belegen ca. 6,2 GB (Grafana 13 allein ~2 GB inkl. Plugin-Kopie).
- name: SD-Karte gross genug
  ansible.builtin.assert:
    that:
      - (ansible_mounts | selectattr('mount', 'equalto', '/') | first).size_total >= oh_min_disk_hard_gb * 1e9
    fail_msg: >-
      Das Dateisystem hat nur {{ ((ansible_mounts | selectattr('mount', 'equalto', '/') | first).size_total / 1e9) | round(1) }} GB.
      Mindestens eine 16-GB-Karte verwenden (empfohlen: 32 GB, Klasse A1/A2).
    quiet: true

# SQLite (Grafana) und InfluxDB schreiben synchron in kleinen Bloecken. Alte Karten
# schaffen davon nur wenige pro Sekunde (gemessen: SA08G/2014 = 2/s, A1-Norm >= 500/s).
- name: Schreibleistung der SD-Karte messen (100 x 4 KB synchron)
  ansible.builtin.shell: >-
    set -o pipefail;
    start=$(date +%s.%N);
    timeout 60 dd if=/dev/zero of=/var/tmp/oh-kartentest bs=4k count=100 oflag=dsync status=none;
    rc=$?; ende=$(date +%s.%N); rm -f /var/tmp/oh-kartentest;
    [ $rc -eq 0 ] && awk -v s="$start" -v e="$ende" 'BEGIN { printf "%d\n", 100 / (e - s) }' || echo 0
  args:
    executable: /bin/bash
  register: base_card_iops
  changed_when: false
  check_mode: false

- name: SD-Karte schnell genug
  ansible.builtin.assert:
    that:
      - base_card_iops.stdout | int >= oh_min_card_iops
    fail_msg: >-
      Die SD-Karte schafft nur {{ base_card_iops.stdout }} synchrone Schreibvorgaenge pro Sekunde
      (noetig: {{ oh_min_card_iops }}). Grafana und InfluxDB waeren damit unbenutzbar langsam.
      Eine aktuelle Karte der Klasse A1 oder A2 verwenden.
    success_msg: "SD-Karte: {{ base_card_iops.stdout }} synchrone Schreibvorgaenge/s"

- name: Heruntergeladene Pakete nach der Installation loeschen (spart ca. 0,7 GB)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/01openandhome-keine-archive
    content: |
      // openandhome: SD-Karte schonen, .deb-Dateien nach erfolgreicher Installation loeschen
      APT::Keep-Downloaded-Packages "false";
      Binary::apt::APT::Keep-Downloaded-Packages "false";
    mode: "0644"

- name: Grundpakete installieren
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- Fremdquellen ------------------------------------------------------------

- name: Schluessel-Ordner auf dem Werkstatt-PC
  ansible.builtin.file:
    path: "{{ oh_cache_dir }}/apt-keys"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true

- name: Signaturschluessel auf dem Werkstatt-PC laden
  ansible.builtin.get_url:
    url: "{{ item.key_url }}"
    dest: "{{ oh_cache_dir }}/apt-keys/{{ item.name }}.asc"
    mode: "0644"
    use_netrc: false
  loop: "{{ base_apt_repos }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Fingerabdruecke lesen
  ansible.builtin.command: "gpg --show-keys --with-colons {{ (oh_cache_dir ~ '/apt-keys/' ~ item.name ~ '.asc') | quote }}"
  loop: "{{ base_apt_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: base_key_info
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Fingerabdruecke pruefen
  ansible.builtin.assert:
    that:
      - ('fpr:::::::::' ~ item.item.fingerprint ~ ':') in item.stdout
    fail_msg: "Schluessel fuer {{ item.item.name }} passt nicht zum Fingerabdruck {{ item.item.fingerprint }}."
    quiet: true
  loop: "{{ base_key_info.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  run_once: true

- name: Fremdquellen eintragen
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components }}"
    architectures: arm64
    signed_by: "{{ lookup('ansible.builtin.file', oh_cache_dir ~ '/apt-keys/' ~ item.name ~ '.asc') }}"
  loop: "{{ base_apt_repos }}"
  loop_control:
    label: "{{ item.name }}"
  register: base_repos

- name: System aktualisieren
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    cache_valid_time: "{{ 0 if base_repos is changed else 3600 }}"
    autoremove: true

- name: Neustart noetig?
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required

- name: Neustart nach Kernel-/Firmware-Update
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: base_reboot_required.stat.exists

# --- SD-Karte schonen ----------------------------------------------------------

- name: Drop-in-Ordner anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/rpi/swap.conf.d
    - /etc/systemd/journald.conf.d

- name: Auslagerung nur im RAM (zram)
  ansible.builtin.copy:
    dest: /etc/rpi/swap.conf.d/openandhome.conf
    content: |
      # openandhome: nur zram, keine Auslagerungsdatei auf der SD-Karte
      [Main]
      Mechanism=zram
    mode: "0644"

- name: Aktive Auslagerung lesen
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: base_swaps
  changed_when: false
  check_mode: false

- name: Auslagerungsdatei entfernen
  ansible.builtin.file:
    path: /var/swap
    state: absent
  when: "'/var/swap' not in base_swaps.stdout"

- name: Journal begrenzen
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/openandhome.conf
    content: |
      [Journal]
      SystemMaxUse={{ base_journal_max_use }}
    mode: "0644"
  notify: Journal neu starten

# --- Zugang und Firewall -------------------------------------------------------

- name: SSH nur per Key, kein root
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-openandhome.conf
    content: |
      # openandhome
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: SSH neu laden

- name: Firewall-Regeln
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: nft -c -f %s
  notify: Firewall neu laden

- name: Firewall einschalten
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Automatische Sicherheitsupdates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"
