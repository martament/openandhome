---
# Zugangsdaten je Server: beim ersten Lauf zufaellig erzeugt, danach von dort gelesen.
credentials_file: "{{ oh_server_etc }}/credentials.yml"

# Gut lesbar fuer das Uebergabeblatt (ohne 0/O, 1/l/I)
credentials_chars: abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789
credentials_length: 20

credentials_keys:
  - mqtt_sensorbox       # MQTT-Benutzer "sensorbox" (in die Sensorboxen)
  - mqtt_telegraf        # MQTT-Benutzer "telegraf"
  - influx_admin         # InfluxDB-Benutzer "admin"
  - influx_token         # InfluxDB-Operator-Token
  - influx_telegraf      # InfluxDB v1-Benutzer "telegraf" (schreiben)
  - influx_grafana       # InfluxDB v1-Benutzer "grafana" (lesen)
  - grafana_admin
  - grafana_editor
  - grafana_viewer
