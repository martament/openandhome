---
# Zugangsdaten liegen nur auf dem Server (0600 root) und im Uebergabeprotokoll,
# nie im Repo. Fehlende Schluessel werden zufaellig erzeugt, vorhandene bleiben.

- name: Ablage anlegen
  ansible.builtin.file:
    path: "{{ oh_server_etc }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Vorhandene Zugangsdaten lesen
  ansible.builtin.slurp:
    src: "{{ credentials_file }}"
  register: credentials_existing
  failed_when: false
  no_log: true

- name: Vorhandene Zugangsdaten uebernehmen
  ansible.builtin.set_fact:
    credentials_values: "{{ (credentials_existing.content | default('') | b64decode | from_yaml) or {} }}"
  no_log: true

- name: Fehlende Zugangsdaten erzeugen
  ansible.builtin.set_fact:
    credentials_values: >-
      {{ credentials_values | combine({item: lookup('ansible.builtin.password', '/dev/null',
         length=credentials_length, chars=[credentials_chars])}) }}
  loop: "{{ credentials_keys }}"
  when: item not in credentials_values
  no_log: true

- name: Zugangsdaten speichern
  ansible.builtin.copy:
    content: "{{ credentials_values | to_nice_yaml }}"
    dest: "{{ credentials_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
